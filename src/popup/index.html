<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lecture Transcript Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Transcript Exporter</h1>
      <div id="status-badge" class="status-badge status-loading">Loading...</div>
    </header>
    
    <div id="diagnostics-panel" class="hidden">
      <p id="status-message">Checking page for transcript...</p>
      <button id="btn-copy-diagnostics" class="secondary">Copy Diagnostics</button>
      <p style="font-size: 11px; margin-top: 10px;">
        Paste diagnostics in a <a href="https://github.com/HiroK/lecture-transcript-exporter/issues" target="_blank">GitHub Issue</a>.
      </p>
    </div>

    <div id="export-panel" class="hidden">
      <div class="field-group">
        <label for="mode-select">Content Mode</label>
        <select id="mode-select">
          <option value="transcript">Transcript Only</option>
          <option value="ai_context">AI Context (Includes Slides/Chapters)</option>
        </select>
      </div>

      <div class="field-group">
        <label for="format-select">Format</label>
        <select id="format-select">
          <option value="md">Markdown (.md)</option>
          <option value="txt">Plain Text (.txt)</option>
        </select>
      </div>

      <div class="field-group checkbox-group">
        <input type="checkbox" id="timestamps-check" checked>
        <label for="timestamps-check">Include timestamps</label>
      </div>
      
      <div class="field-group checkbox-group">
        <input type="checkbox" id="cleanup-check" checked>
        <label for="cleanup-check">Clean up transcript (remove duplicates/merge)</label>
      </div>

      <div class="field-group">
        <label>Time Range (Optional)</label>
        <div class="time-inputs">
          <input type="number" id="start-time" placeholder="Start (sec)" min="0">
          <input type="number" id="end-time" placeholder="End (sec)" min="0">
        </div>
      </div>
      
      <div class="field-group">
        <label for="filename-input">Filename</label>
        <input type="text" id="filename-input">
      </div>

      <div class="stats" id="stats-display">
        Segments: 0 | Markers: 0
      </div>

      <div class="actions">
        <button id="btn-copy" class="primary">Copy to Clipboard</button>
        <button id="btn-download" class="primary">Download</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
