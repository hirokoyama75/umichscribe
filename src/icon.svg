<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2046"/>
      <stop offset="100%" stop-color="#1b3b6f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcb05"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f4f8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Document Body -->
  <rect x="28" y="24" width="56" height="76" rx="6" fill="url(#docGrad)" filter="url(#dropShadow)"/>

  <!-- Folded Corner / Accent on top right of document -->
  <path d="M72 24 L84 36 L72 36 Z" fill="#d9e2ec"/>

  <!-- Document Text Lines -->
  <line x1="38" y1="44" x2="74" y2="44" stroke="#486581" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="38" y1="56" x2="68" y2="56" stroke="#627d98" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="67" x2="72" y2="67" stroke="#627d98" stroke-width="4" stroke-linecap="round"/>
  <line x1="38" y1="78" x2="56" y2="78" stroke="#829ab1" stroke-width="4" stroke-linecap="round"/>

  <!-- Audio Waveform Badge / Speech pill at bottom-right -->
  <g transform="translate(68, 68)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="38" height="38" rx="19" fill="url(#accentGrad)"/>
    <!-- Waveform bars -->
    <line x1="11" y1="19" x2="11" y2="19" stroke="#0b2046" stroke-width="3" stroke-linecap="round"/>
    <line x1="16" y1="14" x2="16" y2="24" stroke="#0b2046" stroke-width="3" stroke-linecap="round"/>
    <line x1="21" y1="10" x2="21" y2="28" stroke="#0b2046" stroke-width="3" stroke-linecap="round"/>
    <line x1="26" y1="14" x2="26" y2="24" stroke="#0b2046" stroke-width="3" stroke-linecap="round"/>
    <line x1="31" y1="19" x2="31" y2="19" stroke="#0b2046" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
